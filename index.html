<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GLOBO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div class="plugin-window" id="plugin-window">

    <!-- ═══════════════════════════════════════════════════════════
         MAIN PANEL
    ════════════════════════════════════════════════════════════════ -->
    <div class="panel" id="main-panel">

      <header class="panel-header">
        <!-- Left zone, sized to match .circle-section's own width (see
             .header-left in main.css) so the transport card below can be
             centred over the circle column specifically, not the whole
             header/window. Kept in sync with the resizable divider by
             initResize() in app.js. -->
        <div class="header-left">
          <!-- Brand logo: click to show credits -->
          <div class="brand-select" id="brand-select">
            <button class="brand-btn" id="brand-btn" title="Crediti">
              <img class="brand-logo" src="media/Logo_TempoReale_white.webp" alt="Tempo Reale">
            </button>
          </div>
          <!-- Transport + paradigm card: play/pause on the left, the paradigm
               dropdown (relocated from the bottom of the params panel) in the
               centre, loop/direction on the right. Replaces the old preset
               morph bar, which is now the vertical sidebar on the circle's
               left edge (see .pattern-sidebar in .circle-section). -->
          <div class="transport-card" id="transport-card">
          <button class="transport-toggle" id="transport-toggle" data-state="paused" title="Play">
            <svg class="ico ico-play" viewBox="0 0 18 18" aria-hidden="true">
              <path d="M5 3.5 L14 9 L5 14.5 Z" fill="currentColor"/>
            </svg>
            <svg class="ico ico-pause" viewBox="0 0 18 18" aria-hidden="true">
              <rect x="4.5" y="3.5" width="3" height="11" fill="currentColor"/>
              <rect x="10.5" y="3.5" width="3" height="11" fill="currentColor"/>
            </svg>
          </button>

          <div class="module-select" id="module-select">
            <button class="module-btn mono" id="module-btn">
              <span id="module-btn-label">Perimetro</span>
            </button>
            <div class="module-menu" id="module-menu" hidden>
              <button class="module-choice active" data-module="perimetro">Perimetro</button>
              <button class="module-choice"        data-module="aleatorio">Aleatorio</button>
              <button class="module-choice"        data-module="segmento">Segmento</button>
              <button class="module-choice"        data-module="traversa">Traversa</button>
              <button class="module-choice"        data-module="diretto">Diretto</button>
            </div>
          </div>

          <div class="transport-group-mini" id="transport-group-mini">
            <!-- Loop + direction: mockup, not wired to any logic yet -->
            <button class="transport-btn" id="loop-toggle" title="Loop">
              <svg class="ico" viewBox="0 0 18 18" aria-hidden="true">
                <path d="M4.2 7.2 A5.2 5.2 0 0 1 13.6 5.6" fill="none" stroke="currentColor" stroke-width="1.4"/>
                <path d="M12 3.8 L13.9 5.5 L11.9 7.1" fill="none" stroke="currentColor" stroke-width="1.4"/>
                <path d="M13.8 10.8 A5.2 5.2 0 0 1 4.4 12.4" fill="none" stroke="currentColor" stroke-width="1.4"/>
                <path d="M6 14.2 L4.1 12.5 L6.1 10.9" fill="none" stroke="currentColor" stroke-width="1.4"/>
              </svg>
            </button>
            <button class="transport-btn" id="direction-toggle" title="Direzione">
              <svg class="ico" viewBox="0 0 18 18" aria-hidden="true">
                <line x1="3" y1="9" x2="15" y2="9" stroke="currentColor" stroke-width="1.4"/>
                <path d="M5.6 6.4 L3 9 L5.6 11.6" fill="none" stroke="currentColor" stroke-width="1.4"/>
                <path d="M12.4 6.4 L15 9 L12.4 11.6" fill="none" stroke="currentColor" stroke-width="1.4"/>
              </svg>
            </button>
          </div>
          </div>
        </div>

        <!-- Right side: spread macro + spat selector + ψ settings trigger + instance badge -->
        <div class="header-right">
          <!-- Spread macro: a per-paradigm mockup value (remembered separately
               for each movement paradigm, included in presets) — sits right
               beside the algorithm (VBAP/DBAP/...) button, no duplicate row
               in the params panel. -->
          <div class="spread-select" id="spread-select">
            <span class="spread-lbl mono">Spread</span>
            <div class="spread-track" id="spread-track" title="Spread (macro per paradigma)">
              <div class="spread-thumb" id="spread-thumb"></div>
            </div>
            <!-- Single live indicator instead of two flanking icons: its own
                 size + blur scale with the current value (see render() in
                 initSpreadSelect, app.js) — small/sharp at 0, big/soft at
                 100 — rather than two static narrow/wide markers. -->
            <div class="spread-indicator" id="spread-indicator" aria-hidden="true">
              <span class="spread-dot" id="spread-dot"></span>
            </div>
          </div>
          <div class="spat-select" id="spat-select">
            <button class="spat-btn mono" id="spat-btn">VBAP</button>
            <div class="spat-menu" id="spat-menu" hidden>
              <button class="spat-choice active"        data-spat="vbap">VBAP</button>
              <button class="spat-choice" data-spat="dbap">DBAP</button>
              <button class="spat-choice"        data-spat="ambisonics">AmbiV</button>
              <button class="spat-choice"        data-spat="direct">Direct</button>
            </div>
          </div>
          <button class="logo-btn" id="logo-btn" title="Impostazioni"><svg class="logo-ico" viewBox="0 0 18 18" aria-hidden="true" style="fill: #505050"><line x1="2.5" y1="5" x2="15.5" y2="5" stroke="currentColor" stroke-width="1"/><line x1="2.5" y1="9" x2="15.5" y2="9" stroke="currentColor" stroke-width="1"/><line x1="2.5" y1="13" x2="15.5" y2="13" stroke="currentColor" stroke-width="1"/><circle cx="11" cy="5" r="1.4" fill="var(--surface)" stroke="currentColor" stroke-width="1"/><circle cx="6" cy="9" r="1.4" fill="var(--surface)" stroke="currentColor" stroke-width="1"/><circle cx="12" cy="13" r="1.4" fill="var(--surface)" stroke="currentColor" stroke-width="1"/></svg></button>
          <span class="instance-badge mono" id="instance-badge">#1</span>
        </div>
      </header>

      <div class="panel-body">

        <!-- ─── LEFT: Circle navigation ─── -->
        <section class="circle-section">

          <!-- Subgroup selector: which speaker subgroup(s) this spatialization drives (mockup) -->
          <div class="subgroup-select" id="subgroup-select">
            <span class="subgroup-letters mono" id="subgroup-letters"></span>
            <button class="subgroup-btn" id="subgroup-btn" title="Subgroup altoparlanti">
              <svg class="ico" viewBox="0 0 18 18" aria-hidden="true">
                <circle cx="5" cy="12" r="2" fill="none" stroke="currentColor" stroke-width="1.4"/>
                <circle cx="13" cy="12" r="2" fill="none" stroke="currentColor" stroke-width="1.4"/>
                <circle cx="9" cy="5" r="2" fill="none" stroke="currentColor" stroke-width="1.4"/>
              </svg>
            </button>
            <!-- Populated from the Rig tab's subset list — see rebuildSubgroupMenu in app.js -->
            <div class="subgroup-menu" id="subgroup-menu" hidden></div>
          </div>

          <!-- Source pair-mode selector: mirrors .subgroup-select on the
               opposite corner — mockup only for now, not wired to any real
               audio logic. Button icon switches single/double circle to
               match whichever option is picked. -->
          <div class="pair-select" id="pair-select">
            <button class="pair-btn" id="pair-btn" title="Single (mono sum)">
              <svg class="ico" viewBox="0 0 18 18" aria-hidden="true">
                <circle cx="9" cy="9" r="4" fill="none" stroke="currentColor" stroke-width="1.4"/>
              </svg>
            </button>
            <div class="pair-menu" id="pair-menu" hidden>
              <button class="pair-choice active" data-pair="single">Single (mono sum)</button>
              <button class="pair-choice"        data-pair="paired">Double paired</button>
              <button class="pair-choice"        data-pair="mirrored">Double mirrored</button>
              <button class="pair-choice"        data-pair="opposite">Double opposite</button>
            </div>
          </div>

          <div class="circle-area">
            <div class="circle-svg-wrap">
              <svg id="nav-circle" class="circle-svg" viewBox="0 0 200 200"
                   xmlns="http://www.w3.org/2000/svg"
                   aria-label="Navigazione azimutale"></svg>
              <svg id="nav-circle-iso" class="circle-svg" viewBox="0 0 200 200"
                   xmlns="http://www.w3.org/2000/svg"
                   aria-label="Navigazione azimutale (vista isometrica)" hidden>
                <g id="circle-iso-content"></g>
              </svg>
            </div>

            <!-- Elevation readhead (H) — own standalone vertical slider, same
                 thin-track-with-thumb look as the preset morph slider in the
                 header, just rotated. Top = 1, bottom = 0, matching
                 .height-range's own top=max/bottom=min sense. A sibling of
                 .height-control itself, not nested inside it. Reuses
                 .height-control's own layout class wholesale (see
                 .el-slider-col's margin-right override in main.css for the
                 gap between the two) with invisible stand-ins for the
                 mode-toggle button and the height-val readout, so the
                 track ends up EXACTLY as long as .height-range — both
                 columns are now built from the identical recipe of
                 fixed-size + flexible pieces. -->
            <div class="height-control el-slider-col">
              <div class="el-slider-btn-spacer" aria-hidden="true"></div>
              <div class="height-track">
                <span class="height-lbl mono" aria-hidden="true">90°</span>
                <div class="el-slider-track" id="el-slider-track" title="Testina di lettura H (altezza)">
                  <div class="el-slider-thumb" id="el-slider-thumb"></div>
                </div>
                <span class="height-lbl mono" aria-hidden="true">0°</span>
              </div>
              <span class="height-val mono" aria-hidden="true" style="visibility: hidden;">0°</span>
            </div>

            <div class="height-control">
              <button class="mode-toggle" id="height-mode-toggle" data-mode="hemisphere" title="Semisfera (clic: sfera)" aria-label="Modalità altezza">
                <svg class="ico ico-hemi" viewBox="0 0 18 18" aria-hidden="true">
                  <path d="M2 13 A7 7 0 0 1 16 13" fill="none" stroke="currentColor" stroke-width="1"/>
                  <line x1="1" y1="13" x2="17" y2="13" stroke="currentColor" stroke-width="1"/>
                </svg>
                <svg class="ico ico-sphere" viewBox="0 0 18 18" aria-hidden="true">
                  <circle cx="9" cy="9" r="7" fill="none" stroke="currentColor" stroke-width="1"/>
                  <ellipse cx="9" cy="9" rx="7" ry="2.6" fill="none" stroke="currentColor" stroke-width="0.8"/>
                </svg>
              </button>
              <div class="height-track">
                <span class="height-lbl top mono">90°</span>
                <div class="height-range" id="height-range">
                  <div class="height-fill" id="height-fill"></div>
                  <div class="height-thumb" id="height-thumb-max" title="Elevazione massima"></div>
                  <div class="height-thumb" id="height-thumb-min" title="Elevazione minima"></div>
                </div>
                <span class="height-lbl bot mono">0°</span>
              </div>
              <span class="height-val mono" id="height-val">0°</span>
            </div>
          </div>

          <!-- Sibling of .subgroup-select (both anchored to .circle-section),
               not nested inside .circle-area. Anchored to the bottom of the
               section with the same 8px margin .subgroup-select has from
               the top — .readhead-bar (further down) is hidden now, so this
               no longer needs to sit "above" it specifically. -->
          <div class="circle-view-controls">
            <button class="circle-view-btn mono" id="circle-iso-toggle" title="Vista isometrica (poi trascina la vista per ruotarla)">
              <span id="circle-iso-toggle-label">3D</span>
            </button>
          </div>

          <!-- Mirrors .circle-view-controls on the opposite corner — toggles
               the speaker-position illustrations on/off, in both views. -->
          <div class="circle-view-controls-left">
            <button class="circle-view-btn" id="speaker-viz-toggle" title="Mostra/nascondi le casse">
              <svg class="ico" viewBox="0 0 18 18" aria-hidden="true">
                <path d="M8.5 7 L5.5 7 L5.5 11 L8.5 11 L12.5 15 L12.5 3 Z" fill="currentColor"/>
              </svg>
            </button>
          </div>

          <!-- Preset "mega slider" — the same 16-slot bar + morph track that
               used to live horizontally in the header, now vertical, sitting
               in the same left:8px column as #pair-btn (above) and
               #speaker-viz-toggle (below), between the two. Floats over the
               circle graphic (circle-area reserves space on its left via
               padding so it doesn't sit under it — see .circle-area). Shown
               by default; collapsed with #pattern-sidebar-tab. -->
          <div class="pattern-sidebar" id="pattern-sidebar" hidden>
            <div class="pattern-bar-v" id="pattern-bar"></div>
            <div class="pattern-morph-track-v" id="pattern-morph-track" title="Trascina per fare il morph tra i preset">
              <div class="pattern-morph-thumb-v" id="pattern-thumb"></div>
            </div>
          </div>

          <!-- Edge tab: collapses/expands .pattern-sidebar. Default: collapsed.
               Plain grey CSS triangle (see .edge-tab-left::before), no icon markup. -->
          <button class="edge-tab edge-tab-left collapsed" id="pattern-sidebar-tab" title="Mostra/nascondi i preset"></button>

          <!-- Azimuth readhead (A) — own standalone slider, same thin-track-
               with-thumb look as the preset morph slider in the header.
               Mirrors .arc-btn-bar-wrap's own centering trick (the ghost
               spacer) so the track lines up with the circle, not the whole
               row's width. -->
          <div class="az-slider-wrap">
            <!-- Mirrors the sidebar's own footprint on the left, now that
                 .circle-area reserves space for it too — keeps this bar
                 centred on the circle's new (more centred) position rather
                 than on the row's full width. -->
            <div class="pattern-sidebar-ghost" aria-hidden="true"></div>
            <div class="az-slider-track" id="az-slider-track" title="Testina di lettura A">
              <div class="az-slider-thumb" id="az-slider-thumb"></div>
            </div>
            <div class="height-control-ghost" aria-hidden="true"></div>
          </div>

          <!-- Arc colour buttons — populated by arcs.js -->
          <div class="arc-btn-bar-wrap" id="arc-btn-bar-wrap" hidden>
            <div class="pattern-sidebar-ghost" aria-hidden="true"></div>
            <div class="arc-btn-bar" id="arc-btn-bar"></div>
            <!-- Mirrors .height-control's footprint so the patches center on the circle, not on the whole row -->
            <div class="height-control-ghost" aria-hidden="true"></div>
          </div>

          <!-- Edge tab: collapses/expands .arc-btn-bar-wrap (the colour
               pattern boxes). Default: collapsed. Plain grey CSS triangle
               (see .edge-tab-bottom::before), no icon markup. -->
          <button class="edge-tab edge-tab-bottom collapsed" id="arc-bar-tab" title="Mostra/nascondi le zone"></button>

          <!-- Ease/intensity controls — parked for now (hidden), not deleted:
               the A/H readheads got their own dedicated sliders above/in the
               height column (see .az-slider-wrap / .el-slider-track), so the
               old shared track + A/H switch they used to share are gone, but
               this ease panel has no replacement yet and may come back later
               (see #readhead-bar[hidden] in components.css). -->
          <div class="readhead-bar" id="readhead-bar" hidden>
            <div class="rh-dots" id="rh-dots"></div>
            <div class="rh-controls">
              <div class="rh-ease-select" id="rh-ease-select">
                <button class="rh-ease-btn" id="rh-ease-btn" data-ease="in" title="Curva di easing">
                  <svg class="ico ico-ease-in" viewBox="0 0 18 18" aria-hidden="true"><path d="M3,14 C11,14 15,10 15,4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
                  <svg class="ico ico-ease-out" viewBox="0 0 18 18" aria-hidden="true"><path d="M3,14 C3,8 7,4 15,4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
                  <svg class="ico ico-ease-double" viewBox="0 0 18 18" aria-hidden="true"><path d="M3,14 C9,14 9,4 15,4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
                  <svg class="ico ico-ease-random" viewBox="0 0 18 18" aria-hidden="true"><circle cx="4" cy="5" r="1.4" fill="currentColor"/><circle cx="10" cy="12" r="1.4" fill="currentColor"/><circle cx="14" cy="6" r="1.4" fill="currentColor"/><circle cx="6" cy="13" r="1.4" fill="currentColor"/></svg>
                </button>
                <div class="rh-ease-menu" id="rh-ease-menu" hidden>
                  <button class="rh-ease-choice active" data-ease="in">ease in</button>
                  <button class="rh-ease-choice"        data-ease="out">ease out</button>
                  <button class="rh-ease-choice"        data-ease="double">↔ double</button>
                </div>
              </div>
              <input type="range" id="rh-force" class="rh-force-slider"
                     min="0" max="100" value="0">
              <span class="mono rh-force-val" id="rh-force-val" style="display: none;">0%</span>
            </div>
          </div>

        </section>

        <!-- ─── Resize handle ─── -->
        <div class="panel-resize-handle" id="panel-resize" style="width: 3px"></div>

        <!-- ─── RIGHT: Module parameters ─── -->
        <section class="params-section">
          <!-- Unified speed range: min/max shared by every movement paradigm.
               Perimetro has only one speed, so the min handle auto-locks to 0.
               Persistent (not re-rendered by modules.js), so it's not wiped
               when the paradigm's own param list below is swapped out. -->
          <div class="params-speed-row" id="params-speed-row">
            <span class="param-name" id="speed-label">Rate</span>
            <div class="dslider-track" id="speed-track" title="Doppio click per unire/separare i due limiti">
              <div class="dslider-fill" id="speed-fill"></div>
              <div class="dslider-thumb" id="speed-thumb-min" title="Velocità minima"></div>
              <div class="dslider-thumb" id="speed-thumb-max" title="Velocità massima"></div>
            </div>
            <span class="param-value mono dslider-val">
              <span id="speed-min-val">40</span><span class="dslider-sep">–</span><span id="speed-max-val">120</span><span class="unit-suffix" id="speed-unit">ms</span>
            </span>
          </div>

          <div class="module-params" id="module-params" role="tabpanel">
            <!-- populated by modules.js -->
          </div>

          <!-- Slave indicator: diagonal lines in bottom-right corner -->
          <!-- <canvas class="slave-canvas" id="slave-canvas" aria-hidden="true"></canvas> -->
        </section>

      </div><!-- /panel-body -->
    </div><!-- /main-panel -->


    <!-- ═══════════════════════════════════════════════════════════
         SECONDARY PANEL  (overlay, activated by logo click / ESC)
    ════════════════════════════════════════════════════════════════ -->
    <div class="panel overlay" id="secondary-panel" hidden>

      <header class="panel-header">
        <!-- Brand logo: click to show credits (same trigger as main panel) -->
        <div class="brand-select" id="brand-select-2">
          <button class="brand-btn" id="brand-btn-2" title="Crediti">
            <img class="brand-logo" src="media/Logo_TempoReale_white.webp" alt="Tempo Reale">
          </button>
        </div>
        <!-- Settings tabs — same style as algorithm tabs in main panel -->
        <nav class="tab-bar settings-tabs-bar" id="settings-tabs" role="tablist">
          <button class="tab active" data-settings="rig"      role="tab">Rig</button>
          <button class="tab"        data-settings="audio"    role="tab">Audio</button>
          <button class="tab"        data-settings="generali" role="tab">Generali</button>
          <button class="tab"        data-settings="network"  role="tab">Network</button>
        </nav>
        <!-- Right side: spat selector (mirrors main panel) + ψ close button + instance badge -->
        <div class="header-right">
          <div class="spat-select" id="spat-select-2">
            <button class="spat-btn mono" id="spat-btn-2">VBAP</button>
            <div class="spat-menu" id="spat-menu-2" hidden>
              <button class="spat-choice active" data-spat="vbap">VBAP</button>
              <button class="spat-choice" data-spat="dbap">DBAP</button>
              <button class="spat-choice" data-spat="ambisonics">AmbiV</button>
              <button class="spat-choice" data-spat="direct">Direct</button>
            </div>
          </div>
          <button class="logo-btn active-logo" id="logo-btn-2" title="Chiudi (ESC)"><svg class="logo-ico" viewBox="0 0 18 18" aria-hidden="true"><line x1="2.5" y1="5" x2="15.5" y2="5" stroke="currentColor" stroke-width="1"/><line x1="2.5" y1="9" x2="15.5" y2="9" stroke="currentColor" stroke-width="1"/><line x1="2.5" y1="13" x2="15.5" y2="13" stroke="currentColor" stroke-width="1"/><circle cx="11" cy="5" r="1.4" fill="var(--surface)" stroke="currentColor" stroke-width="1"/><circle cx="6" cy="9" r="1.4" fill="var(--surface)" stroke="currentColor" stroke-width="1"/><circle cx="12" cy="13" r="1.4" fill="var(--surface)" stroke="currentColor" stroke-width="1"/></svg></button>
          <span class="instance-badge mono">#1</span>
        </div>
      </header>

      <div class="panel-body">
        <div class="settings-body" id="settings-body">
          <!-- populated by app.js -->
        </div>
      </div>

      <!-- Global / stray toggle: scoped to the active settings tab, bottom-right -->
      <footer class="settings-footer">
        <div class="gs-toggle" id="gs-toggle">
          <button class="gs-btn active" data-gs="global">global</button>
          <button class="gs-btn"        data-gs="stray">stray</button>
        </div>
      </footer>

    </div><!-- /secondary-panel -->

    <!-- Credits modal (click the Tempo Reale logo) -->
    <div class="brand-backdrop" id="brand-backdrop"></div>
    <div class="brand-menu" id="brand-menu">
      <div class="brand-menu-title">Smov 2 - Paradigmatic Sound Panner</div>
      <div class="brand-menu-row">
        <span class="brand-menu-lbl">Sviluppo</span>
        <span class="brand-menu-val">Pierpaolo Ovarini</span>
      </div>
      <div class="brand-menu-row">
        <span class="brand-menu-lbl">Build</span>
        <span class="brand-menu-val mono">Mockup</span>
      </div>
    </div>

  </div><!-- /plugin-window -->

  <script src="js/circle.js"></script>
  <script src="js/circle-iso.js"></script>
  <script src="js/modules.js"></script>
  <script src="js/rig.js"></script>
  <script src="js/arcs.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
